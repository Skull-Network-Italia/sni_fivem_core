name: Lua Quality (FiveM / ESX)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lua Quality (Windows Self-Hosted)
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------
      # VERIFY BINARIES
      # ------------------------
      - name: Verify tools
        shell: powershell
        run: |
          if (-Not (Test-Path "C:\tools\luacheck.exe")) {
            Write-Error "luacheck.exe not found"
          }
          if (-Not (Test-Path "C:\tools\stylua.exe")) {
            Write-Error "stylua.exe not found"
          }

          C:\tools\luacheck.exe --version
          C:\tools\stylua.exe --version

      # ------------------------
      # STYLUA (CHECK ONLY → SUMMARY)
      # ------------------------
      - name: Run Stylua (check only)
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Running Stylua (check only)..."

          C:\tools\stylua.exe . --check --output-format json `
            > stylua-report.json 2> stylua.log || exit 0

          if (Test-Path stylua-report.json) {
            $count = (Get-Content stylua-report.json | ConvertFrom-Json).Count
            Add-Content $env:GITHUB_STEP_SUMMARY "## ✨ Stylua Format Check"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "- Issues found: **$count**"
            Add-Content $env:GITHUB_STEP_SUMMARY "- Tool: Stylua 2.3.1"
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "_Job does not fail on formatting issues_"
          }

      # ------------------------
      # LUACHECK (JUnit)
      # ------------------------
      - name: Run Luacheck (JUnit)
        shell: powershell
        run: |
          Write-Host "Running Luacheck..."

          cmd /c ^
            "C:\tools\luacheck.exe . ^
            --config .luacheckrc ^
            --formatter JUnit ^
            --codes ^
            --quiet ^
            --no-color ^
            1> junit.xml ^
            2> luacheck.log ^
            || exit /b 0"

      # ------------------------
      # PUBLISH LUACHECK REPORT
      # ------------------------
      - name: Publish Luacheck Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit.xml
          check_name: Lua Lint Report
          fail_on_failure: false
          include_passed: true
          include_empty_in_summary: true
          job_summary: true
          verbose_summary: true
          check_annotations: true
