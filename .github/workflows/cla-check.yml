name: CLA Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  issues: read
  statuses: write

jobs:
  cla-check:
    runs-on: self-hosted

    steps:
      - name: Check CLA acceptance comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          CLA_PHRASE="I have read and agree to the CLA"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          COMMENTS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments)

          if echo "$COMMENTS" | jq -e \
            ".[] | select(.user.login == \"$AUTHOR\") | select(.body | contains(\"$CLA_PHRASE\"))" > /dev/null
          then
            echo "✅ CLA accepted"
          else
            echo "❌ CLA NOT accepted"
            echo ""
            echo "Please comment exactly:"
            echo "\"I have read and agree to the CLA\""
            exit 1
          fi
